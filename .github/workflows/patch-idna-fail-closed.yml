name: Patch IDNA fail closed

on:
  push:
    branches:
      - fix/website-unicode-idna-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded patch
        run: python scripts/_patch_idna_fail_closed.py
      - name: Verify
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          python -m pytest -q tests/test_website_parser.py tests/test_website_http.py tests/test_website_unicode_reconciliation.py
          python -m pytest -q
      - name: Commit and remove helpers
        run: |
          rm scripts/_patch_idna_fail_closed.py
          rm .github/workflows/patch-idna-fail-closed.yml
          rm -rf src/sara_local_collector.egg-info
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fail closed on ambiguous IDNA host mappings"
          git push origin HEAD:${GITHUB_REF_NAME}
