name: Patch two-pass URL regression

on:
  push:
    branches:
      - fix/website-url-convergence-validation-roles

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/website-url-convergence-validation-roles
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add end-to-end redirect regression
        shell: bash
        run: |
          cat >> tests/test_website_acquisition.py <<'PY'


class RedirectingHomeClient:
    def fetch(self, url: str) -> HttpResponse:
        if url == "http://www.seed.example/":
            final_url = "https://seed.example/"
        elif url == "https://seed.example/":
            final_url = url
        else:
            raise WebsiteFetchError(f"HTTP 404 for {url}")
        body = b'<link rel="canonical" href="https://seed.example/">'
        return HttpResponse(
            requested_url=url,
            final_url=final_url,
            status=200,
            headers={"content-type": "text/html; charset=utf-8"},
            body=body,
            media_type="text/html",
            charset="utf-8",
        )


def test_verified_home_redirect_survives_second_acquisition_target_resolution(
    tmp_path: Path,
) -> None:
    conn = prepared(
        tmp_path / "redirect-two-pass.sqlite",
        website="http://www.seed.example/",
    )
    entity_id = business_entity_id_for_maps_business(1)
    clock = Clock()
    client = RedirectingHomeClient()
    config = CrawlConfig(page_limit=1, depth_limit=0)

    first = collect_official_website(
        conn,
        evidence_root=tmp_path / "evidence",
        business_id=1,
        config=config,
        now=clock,
        client_factory=factory(client),
    )
    assert first.status == "complete"
    assert first.start_url == "http://www.seed.example/"
    assert first.canonical_home_url == "https://seed.example/"

    current = fact(conn, entity_id, "business.website.official")
    assert json.loads(current[1]) == "https://seed.example/"
    assert current[2] == "single_source"
    assert conn.execute(
        "SELECT COUNT(*) FROM fact_observation_support "
        "WHERE fact_id=? AND support_role='contradicts'",
        (current[0],),
    ).fetchone()[0] == 0

    second = collect_official_website(
        conn,
        evidence_root=tmp_path / "evidence",
        business_id=1,
        config=config,
        now=clock,
        client_factory=factory(client),
    )
    assert second.status == "complete"
    assert second.start_url == "https://seed.example/"
    assert second.canonical_home_url == "https://seed.example/"
    assert conn.execute(
        "SELECT COUNT(*) FROM acquisition_sessions "
        "WHERE source_id='src_official_web' AND collector_name='sara.website'"
    ).fetchone()[0] == 2
    conn.close()
PY
      - name: Run focused tests
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src
          python -m pytest -q tests/test_website_acquisition.py tests/test_website_url_convergence.py
      - name: Commit and remove helper
        shell: bash
        run: |
          rm .github/workflows/patch-two-pass-url-regression.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_website_acquisition.py .github/workflows/patch-two-pass-url-regression.yml
          git commit -m 'Cover repeated acquisition after verified URL convergence'
          git push origin HEAD:fix/website-url-convergence-validation-roles
