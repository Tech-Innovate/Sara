name: Patch URL proof binding

on:
  push:
    branches:
      - fix/website-url-convergence-validation-roles

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/website-url-convergence-validation-roles
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind alias proof to session provenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/sara/website/reconcile.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from .model import OFFICIAL_WEB_SOURCE_ID, RECONCILIATION_VERSION, WebsiteAcquisitionError, opaque_id\n'
          new_import = '''from .model import (\n    COLLECTOR_NAME,\n    OFFICIAL_WEB_SOURCE_ID,\n    RECONCILIATION_VERSION,\n    WebsiteAcquisitionError,\n    opaque_id,\n    sha256_text,\n)\n'''
          if text.count(old_import) != 1:
              raise SystemExit('model import anchor mismatch')
          text = text.replace(old_import, new_import, 1)

          old_sig = '''def _verified_website_alias_from_new_evidence(\n    conn: sqlite3.Connection,\n    observations: list[dict[str, Any]],\n    left_json: object,\n    right_json: object,\n) -> bool:\n'''
          new_sig = '''def _verified_website_alias_from_new_evidence(\n    conn: sqlite3.Connection,\n    observations: list[dict[str, Any]],\n    *,\n    entity_id: str,\n    left_json: object,\n    right_json: object,\n) -> bool:\n'''
          if text.count(old_sig) != 1:
              raise SystemExit('helper signature anchor mismatch')
          text = text.replace(old_sig, new_sig, 1)

          old_loop = '''    for item in observations:\n        evidence_id = item.get("evidence_id")\n        if not isinstance(evidence_id, str) or not evidence_id:\n            continue\n        row = conn.execute(\n            "SELECT source_id,status,metadata_json FROM evidence_items WHERE id=?",\n            (evidence_id,),\n        ).fetchone()\n        if row is None or row[0] != OFFICIAL_WEB_SOURCE_ID or row[1] != "usable":\n            continue\n        metadata = _parse_json(row[2])\n        if not isinstance(metadata, dict):\n            continue\n        if metadata.get("acquisition_kind") != "bounded_official_website":\n            continue\n        if metadata.get("home_page") is not True:\n            continue\n        start_value = metadata.get("start_url")\n        final_value = metadata.get("final_url")\n        if not isinstance(start_value, str) or not isinstance(final_value, str):\n            continue\n        start_url = normalize_http_url(start_value)\n        final_url = normalize_http_url(final_value)\n        if start_url is None or final_url is None or not same_site(start_url, final_url):\n            continue\n        if start_url == left_url and final_url == right_url:\n            return True\n'''
          new_loop = '''    for item in observations:\n        observation_id = item.get("id")\n        evidence_id = item.get("evidence_id")\n        if (\n            not isinstance(observation_id, str)\n            or not observation_id\n            or not isinstance(evidence_id, str)\n            or not evidence_id\n        ):\n            continue\n        row = conn.execute(\n            "SELECT e.source_id,e.status,e.source_locator,e.metadata_json,"\n            "a.target_subject_id,a.source_id,a.collector_name,a.config_json,a.config_hash,"\n            "o.subject_id,o.predicate,o.value_json "\n            "FROM observations o "\n            "JOIN evidence_items e ON e.id=o.evidence_id "\n            "JOIN acquisition_sessions a ON a.id=e.acquisition_session_id "\n            "WHERE o.id=? AND e.id=?",\n            (observation_id, evidence_id),\n        ).fetchone()\n        if row is None:\n            continue\n        if (\n            row[0] != OFFICIAL_WEB_SOURCE_ID\n            or row[1] != "usable"\n            or row[4] != entity_id\n            or row[5] != OFFICIAL_WEB_SOURCE_ID\n            or row[6] != COLLECTOR_NAME\n            or row[9] != entity_id\n            or row[10] != "business.website.official"\n            or row[11] != right_json\n        ):\n            continue\n        config_json = row[7]\n        if (\n            not isinstance(config_json, str)\n            or str(row[8]) != sha256_text(config_json)\n        ):\n            continue\n        config = _parse_json(config_json)\n        metadata = _parse_json(row[3])\n        if not isinstance(config, dict) or not isinstance(metadata, dict):\n            continue\n        if metadata.get("acquisition_kind") != "bounded_official_website":\n            continue\n        if metadata.get("entity_id") != entity_id or metadata.get("home_page") is not True:\n            continue\n        start_value = metadata.get("start_url")\n        final_value = metadata.get("final_url")\n        configured_start = config.get("start_url")\n        source_locator = row[2]\n        if not all(\n            isinstance(value, str)\n            for value in (start_value, final_value, configured_start, source_locator)\n        ):\n            continue\n        start_url = normalize_http_url(start_value)\n        final_url = normalize_http_url(final_value)\n        config_start_url = normalize_http_url(configured_start)\n        locator_url = normalize_http_url(source_locator)\n        if (\n            start_url is None\n            or final_url is None\n            or config_start_url is None\n            or locator_url is None\n            or config_start_url != start_url\n            or locator_url != final_url\n            or not same_site(start_url, final_url)\n        ):\n            continue\n        if start_url == left_url and final_url == right_url:\n            return True\n'''
          if text.count(old_loop) != 1:
              raise SystemExit('helper evidence loop anchor mismatch')
          text = text.replace(old_loop, new_loop, 1)

          old_call = '''        and _verified_website_alias_from_new_evidence(\n            conn, observations, current["value_json"], value_json\n        )\n'''
          new_call = '''        and _verified_website_alias_from_new_evidence(\n            conn,\n            observations,\n            entity_id=entity_id,\n            left_json=current["value_json"],\n            right_json=value_json,\n        )\n'''
          if text.count(old_call) != 1:
              raise SystemExit('current alias call anchor mismatch')
          text = text.replace(old_call, new_call, 1)

          old_loop_call = '''                and _verified_website_alias_from_new_evidence(\n                    conn, observations, item["value_json"], value_json\n                )\n'''
          new_loop_call = '''                and _verified_website_alias_from_new_evidence(\n                    conn,\n                    observations,\n                    entity_id=entity_id,\n                    left_json=item["value_json"],\n                    right_json=value_json,\n                )\n'''
          if text.count(old_loop_call) != 1:
              raise SystemExit('previous alias call anchor mismatch')
          text = text.replace(old_loop_call, new_loop_call, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_website_url_convergence.py')
          text = path.read_text(encoding='utf-8')
          old_def = 'def _official_observation(conn, *, start_url: str, final_url: str, home_page: bool = True):\n'
          new_def = '''def _official_observation(\n    conn,\n    *,\n    start_url: str,\n    final_url: str,\n    home_page: bool = True,\n    session_start_url: str | None = None,\n):\n'''
          if text.count(old_def) != 1:
              raise SystemExit('test helper signature anchor mismatch')
          text = text.replace(old_def, new_def, 1)
          old_setup = '''    config_hash = sha256_text("{}")\n    metadata = canonical_json(\n        {\n            "acquisition_kind": "bounded_official_website",\n            "start_url": start_url,\n            "requested_url": start_url,\n            "final_url": final_url,\n            "home_page": home_page,\n        }\n    )\n'''
          new_setup = '''    config_json = canonical_json(\n        {"entity_id": "be", "start_url": session_start_url or start_url}\n    )\n    config_hash = sha256_text(config_json)\n    metadata = canonical_json(\n        {\n            "acquisition_kind": "bounded_official_website",\n            "entity_id": "be",\n            "start_url": start_url,\n            "requested_url": start_url,\n            "final_url": final_url,\n            "home_page": home_page,\n        }\n    )\n'''
          if text.count(old_setup) != 1:
              raise SystemExit('test config setup anchor mismatch')
          text = text.replace(old_setup, new_setup, 1)
          old_session = '''        "VALUES ('web','be',?,'sara.website','3','{}',?,'complete',?,?,1,1)",\n        (OFFICIAL_WEB_SOURCE_ID, config_hash, OBSERVED, OBSERVED),\n'''
          new_session = '''        "VALUES ('web','be',?,'sara.website','3',?,?, 'complete',?,?,1,1)",\n        (OFFICIAL_WEB_SOURCE_ID, config_json, config_hash, OBSERVED, OBSERVED),\n'''
          if text.count(old_session) != 1:
              raise SystemExit('test session insert anchor mismatch')
          text = text.replace(old_session, new_session, 1)
          old_evidence = '''        "metadata_json,created_at) VALUES ('ev_web','web',?,'official','usable',?,?,?)",\n        (OFFICIAL_WEB_SOURCE_ID, OBSERVED, metadata, OBSERVED),\n'''
          new_evidence = '''        "source_locator,metadata_json,created_at) VALUES ('ev_web','web',?,'official','usable',?,?,?,?)",\n        (OFFICIAL_WEB_SOURCE_ID, OBSERVED, final_url, metadata, OBSERVED),\n'''
          if text.count(old_evidence) != 1:
              raise SystemExit('test evidence insert anchor mismatch')
          text = text.replace(old_evidence, new_evidence, 1)
          marker = '''def test_cross_site_final_url_never_qualifies_as_verified_alias(tmp_path: Path) -> None:\n'''
          new_test = '''def test_session_start_mismatch_cannot_suppress_contradiction(tmp_path: Path) -> None:\n    conn = _setup(tmp_path / "session-mismatch.sqlite")\n    observation = _official_observation(\n        conn,\n        start_url=OLD_URL,\n        final_url=NEW_URL,\n        session_start_url="http://different-start.example/",\n    )\n    assert _reconcile(conn, observation) == (1, 1, 2)\n    assert _current_links(conn) == [\n        ("contradicts", "src_google_maps"),\n        ("supports", OFFICIAL_WEB_SOURCE_ID),\n    ]\n    conn.close()\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('new regression marker mismatch')
          text = text.replace(marker, new_test + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused tests
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src
          python -m pytest -q tests/test_website_url_convergence.py tests/test_website_reconciliation.py tests/test_website_operational_validation.py
      - name: Commit and remove helper
        shell: bash
        run: |
          rm .github/workflows/patch-url-proof-binding.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sara/website/reconcile.py tests/test_website_url_convergence.py .github/workflows/patch-url-proof-binding.yml
          git commit -m 'Bind website alias convergence to session provenance'
          git push origin HEAD:fix/website-url-convergence-validation-roles
