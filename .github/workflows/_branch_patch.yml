name: Apply branch-local compatibility patch

on:
  push:
    branches:
      - fix/maps-source-shape-merge-probe

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic branch patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/sara/storage.py',
              'from .config import BoundingBox\n',
              'from .config import BoundingBox\nfrom .maps_source import official_website\n',
          )
          replace_once(
              'src/sara/storage.py',
              'def _identity(record: dict[str, Any]) -> tuple[str | None, str | None, str | None, str]:\n    place_id = _text(record.get("place_id"))\n',
              'def _identity(record: dict[str, Any]) -> tuple[str | None, str | None, str | None, str]:\n    website = official_website(record)\n    place_id = _text(record.get("place_id"))\n',
          )
          replace_once(
              'src/sara/storage.py',
              '        _text(record.get("phone")),\n        _text(record.get("website")),\n        None if latitude is None else str(latitude),\n',
              '        _text(record.get("phone")),\n        website,\n        None if latitude is None else str(latitude),\n',
          )
          replace_once(
              'src/sara/storage.py',
              '        "website": _text(record.get("website")),\n',
              '        "website": official_website(record),\n',
          )

          replace_once(
              'src/sara/maps_backfill.py',
              'from .understanding_vocabulary import (\n',
              'from .maps_source import official_website\nfrom .understanding_vocabulary import (\n',
          )
          replace_once(
              'src/sara/maps_backfill.py',
              '        "website": _text(raw.get("website")),\n',
              '        "website": official_website(raw),\n',
          )

          replace_once(
              'src/sara/website_validation.py',
              '    parser.add_argument(\n        "--merge-pair",\n        type=_parse_pair,\n        help="comma-separated complementary-identifier Maps business IDs for the merge-survival probe",\n    )\n',
              '    parser.add_argument(\n        "--merge-probe-business-id",\n        type=int,\n        help=(\n            "real Maps business with at least two strong identifiers; the disposable "\n            "probe copy partitions those identifiers and exercises actual convergence"\n        ),\n    )\n    parser.add_argument(\n        "--merge-pair",\n        type=_parse_pair,\n        help=(\n            "legacy optional natural complementary-identifier pair; prefer "\n            "--merge-probe-business-id for representative gosom data"\n        ),\n    )\n',
          )
          replace_once(
              'src/sara/website_validation.py',
              '    if args.merge_pair is None:\n        raise OperationalValidationError("provide --merge-pair for the evidence-survival probe")\n',
              '    merge_probe_business_id = getattr(args, "merge_probe_business_id", None)\n    if merge_probe_business_id is not None and merge_probe_business_id <= 0:\n        raise OperationalValidationError("--merge-probe-business-id must be a positive integer")\n    if merge_probe_business_id is None and args.merge_pair is None:\n        raise OperationalValidationError(\n            "provide --merge-probe-business-id for the controlled evidence-survival probe "\n            "or the legacy --merge-pair form"\n        )\n    if merge_probe_business_id is not None and args.merge_pair is not None:\n        raise OperationalValidationError(\n            "provide exactly one of --merge-probe-business-id or --merge-pair"\n        )\n',
          )

          replace_once(
              'src/sara/website_validation_cli.py',
              'from .website.surface import collect_official_website\n',
              'from .website.surface import collect_official_website\nfrom .website_validation_merge_probe import run_controlled_merge_survival_probe\n',
          )
          replace_once(
              'src/sara/website_validation_cli.py',
              '            "merge_pair": None if args.merge_pair is None else list(args.merge_pair),\n            "passes_per_business": args.passes,\n',
              '            "merge_pair": None if args.merge_pair is None else list(args.merge_pair),\n            "merge_probe_business_id": getattr(args, "merge_probe_business_id", None),\n            "passes_per_business": args.passes,\n',
          )
          replace_once(
              'src/sara/website_validation_cli.py',
              '    merge_pair: tuple[int, int] | None,\n    passes: int = 2,\n',
              '    merge_pair: tuple[int, int] | None,\n    merge_probe_business_id: int | None = None,\n    passes: int = 2,\n',
          )
          replace_once(
              'src/sara/website_validation_cli.py',
              '    checks.append(_run_merge_survival_probe(working_db, probe_db, merge_pair))\n',
              '    if merge_probe_business_id is not None:\n        checks.append(\n            run_controlled_merge_survival_probe(\n                Path(source_db), probe_db, merge_probe_business_id\n            )\n        )\n    else:\n        checks.append(_run_merge_survival_probe(working_db, probe_db, merge_pair))\n',
          )
          replace_once(
              'src/sara/website_validation_cli.py',
              '            "merge_pair": None if merge_pair is None else list(merge_pair),\n            "passes_per_business": passes,\n',
              '            "merge_pair": None if merge_pair is None else list(merge_pair),\n            "merge_probe_business_id": merge_probe_business_id,\n            "passes_per_business": passes,\n',
          )
          replace_once(
              'src/sara/website_validation_cli.py',
              '            merge_pair=args.merge_pair,\n            passes=args.passes,\n',
              '            merge_pair=args.merge_pair,\n            merge_probe_business_id=args.merge_probe_business_id,\n            passes=args.passes,\n',
          )

          Path('.github/workflows/_branch_patch.yml').unlink()
          PY
      - name: Commit branch patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire Maps source compatibility and controlled merge probe'
          git push origin HEAD:fix/maps-source-shape-merge-probe
