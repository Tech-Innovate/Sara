name: Apply Maps extraction provenance version bump

on:
  push:
    branches:
      - fix/maps-source-shape-merge-probe

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance provenance versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/sara/maps_backfill.py',
              'BACKFILL_VERSION = "1"\nRECONCILIATION_VERSION = "maps-backfill-v1"\n',
              'BACKFILL_VERSION = "2"\nRECONCILIATION_VERSION = "maps-backfill-v2"\n',
          )
          replace_once(
              'src/sara/maps_sync.py',
              'SYNC_VERSION = "1"\nSYNC_RECONCILIATION_VERSION = "maps-sync-v1"\n',
              'SYNC_VERSION = "2"\nSYNC_RECONCILIATION_VERSION = "maps-sync-v2"\n',
          )

          Path('.github/workflows/_version_patch.yml').unlink()
          PY
      - name: Commit branch patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Advance Maps extraction provenance versions'
          git push origin HEAD:fix/maps-source-shape-merge-probe
