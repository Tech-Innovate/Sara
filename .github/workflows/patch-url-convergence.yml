name: Patch URL convergence

on:
  push:
    branches:
      - fix/website-url-convergence-validation-roles

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/website-url-convergence-validation-roles
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/sara/website/reconcile.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from .parser import normalize_http_url\n', 'from .parser import normalize_http_url, same_site\n', 1)
          anchor = '    return normalize_http_url(left) == normalize_http_url(right)\n\n\ndef _current_fact'
          helper = '    return normalize_http_url(left) == normalize_http_url(right)\n\n\ndef _verified_website_alias_from_new_evidence(\n    conn: sqlite3.Connection,\n    observations: list[dict[str, Any]],\n    left_json: object,\n    right_json: object,\n) -> bool:\n    """Return true only for an alias proven by this acquisition\'s retained home evidence.\n\n    This is intentionally directional: the prior fact value must equal the acquisition\n    start URL, and the newly reconciled value must equal the verified home capture\'s\n    final URL. Merely sharing a host, differing by ``www`` or switching schemes is not\n    sufficient.\n    """\n    left = _parse_json(left_json)\n    right = _parse_json(right_json)\n    if not isinstance(left, str) or not isinstance(right, str):\n        return False\n    left_url = normalize_http_url(left)\n    right_url = normalize_http_url(right)\n    if left_url is None or right_url is None:\n        return False\n\n    for item in observations:\n        evidence_id = item.get("evidence_id")\n        if not isinstance(evidence_id, str) or not evidence_id:\n            continue\n        row = conn.execute(\n            "SELECT source_id,status,metadata_json FROM evidence_items WHERE id=?",\n            (evidence_id,),\n        ).fetchone()\n        if row is None or row[0] != OFFICIAL_WEB_SOURCE_ID or row[1] != "usable":\n            continue\n        metadata = _parse_json(row[2])\n        if not isinstance(metadata, dict):\n            continue\n        if metadata.get("acquisition_kind") != "bounded_official_website":\n            continue\n        if metadata.get("home_page") is not True:\n            continue\n        start_value = metadata.get("start_url")\n        final_value = metadata.get("final_url")\n        if not isinstance(start_value, str) or not isinstance(final_value, str):\n            continue\n        start_url = normalize_http_url(start_value)\n        final_url = normalize_http_url(final_value)\n        if start_url is None or final_url is None or not same_site(start_url, final_url):\n            continue\n        if start_url == left_url and final_url == right_url:\n            return True\n    return False\n\n\ndef _current_fact'
          if text.count(anchor) != 1:
              raise SystemExit('reconcile helper anchor mismatch')
          text = text.replace(anchor, helper, 1)
          old = '    semantically_same = values_equivalent(predicate, current["value_json"], value_json)\n'
          new = '    semantically_same = values_equivalent(\n        predicate, current["value_json"], value_json\n    ) or (\n        predicate == "business.website.official"\n        and _verified_website_alias_from_new_evidence(\n            conn, observations, current["value_json"], value_json\n        )\n    )\n'
          if text.count(old) != 1:
              raise SystemExit('semantic-same anchor mismatch')
          text = text.replace(old, new, 1)
          old = '            if not values_equivalent(predicate, item["value_json"], value_json):\n                links += _link_observation(\n'
          new = '            equivalent = values_equivalent(\n                predicate, item["value_json"], value_json\n            ) or (\n                predicate == "business.website.official"\n                and _verified_website_alias_from_new_evidence(\n                    conn, observations, item["value_json"], value_json\n                )\n            )\n            if not equivalent:\n                links += _link_observation(\n'
          if text.count(old) != 1:
              raise SystemExit('contradiction anchor mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('src/sara/website/model.py')
          text = path.read_text(encoding='utf-8')
          old = 'RECONCILIATION_VERSION = "official-web-v1"'
          if text.count(old) != 1:
              raise SystemExit('website reconciliation version anchor mismatch')
          path.write_text(text.replace(old, 'RECONCILIATION_VERSION = "official-web-v2"', 1), encoding='utf-8')

          path = Path('src/sara/website_validation_cli.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'def _run_acquisition_samples(\n'
          helper = 'def _website_acquisition_business_ids(\n    single_location_business_ids: Sequence[int],\n) -> list[int]:\n    return sorted({int(value) for value in single_location_business_ids})\n\n\ndef _run_acquisition_samples(\n'
          if text.count(anchor) != 1:
              raise SystemExit('acquisition helper anchor mismatch')
          text = text.replace(anchor, helper, 1)
          old = '    selected = _selected_business_ids(\n        single_location_business_ids, multi_branch_groups\n    )\n'
          new = '    representative_selected = _selected_business_ids(\n        single_location_business_ids, multi_branch_groups\n    )\n    acquisition_selected = _website_acquisition_business_ids(\n        single_location_business_ids\n    )\n'
          if text.count(old) != 1:
              raise SystemExit('selected IDs anchor mismatch')
          text = text.replace(old, new, 1)
          if text.count('            business_ids=selected,\n') != 1:
              raise SystemExit('acquisition selected use mismatch')
          text = text.replace('            business_ids=selected,\n', '            business_ids=acquisition_selected,\n', 1)
          old = '    dossier_check, dossier_summaries = _representative_dossier_check(\n        working_db, selected\n    )\n'
          new = '    dossier_check, dossier_summaries = _representative_dossier_check(\n        working_db, representative_selected\n    )\n'
          if text.count(old) != 1:
              raise SystemExit('dossier selected use mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('docs/website-operational-validation.md')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('5. Selected official websites can be acquired repeatedly with the bounded production collector, with at least one representative acquisition completing successfully; partial outcomes remain visible rather than being treated as success-by-omission.', '5. Declared single-location acquisition samples can be acquired repeatedly with the bounded production collector, with at least one representative acquisition completing successfully; partial outcomes remain visible rather than being treated as success-by-omission. Multi-branch groups are identity-separation samples and are not implicitly crawled.'),
              ('Every selected acquisition target must already have a supported `business.website.official` fact. Domain discovery is outside this gate and outside the Phase-6 collector.', 'Each declared single-location acquisition target must already have a supported `business.website.official` fact. Multi-branch groups are used to prove canonical identity/location separation before and after acquisition and do not need crawlable websites. Domain discovery is outside this gate and outside the Phase-6 collector.'),
              ('By default, every representative website is acquired twice. The repeat run is deliberate: it exercises historical acquisition/session creation and reconciliation without requiring the collector to pretend that a new acquisition is a no-op.', 'By default, every declared single-location acquisition target is acquired twice. Multi-branch group members are not acquisition targets unless they are separately supplied as single-location samples. The repeat run is deliberate: it exercises historical acquisition/session creation and reconciliation without requiring the collector to pretend that a new acquisition is a no-op.'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'runbook replacement anchor mismatch: {old[:40]}')
              text = text.replace(old, new, 1)
          insertion = '\n## Evidence-backed official-site URL convergence\n\nWebsite reconciliation does not globally collapse `http`/`https` or `www` variants. When a bounded official-site acquisition begins from the currently supported website fact and its retained usable home evidence records that exact `start_url` resolving to the verified home capture `final_url`, reconciliation may treat those two serialized URLs as representations of the same official site for that reconciliation event. The historical observation remains attached to its historical fact; it is not rewritten or attached as exact-value support to the new URL. Without that retained event-local evidence, differing URLs remain distinct and may contradict.\n\nThis reconciliation behavior is versioned as `official-web-v2`; the website collector version remains unchanged because request/extraction behavior did not change.\n'
          marker = '\n## What the gate proves\n'
          if text.count(marker) != 1:
              raise SystemExit('runbook insertion marker mismatch')
          path.write_text(text.replace(marker, insertion + marker, 1), encoding='utf-8')
          PY
      - name: Run focused existing tests
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src
          python -m pytest -q tests/test_website_reconciliation.py tests/test_website_operational_validation.py
      - name: Commit patch and remove helper
        shell: bash
        run: |
          rm .github/workflows/patch-url-convergence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sara/website/reconcile.py src/sara/website/model.py src/sara/website_validation_cli.py docs/website-operational-validation.md .github/workflows/patch-url-convergence.yml
          git commit -m 'Fix official-site URL convergence and validation sample roles'
          git push origin HEAD:fix/website-url-convergence-validation-roles
