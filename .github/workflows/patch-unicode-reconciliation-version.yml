name: Patch Unicode reconciliation provenance

on:
  push:
    branches:
      - fix/website-unicode-idna-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply provenance patch
        run: python scripts/_patch_unicode_reconciliation_version.py
      - name: Verify
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          python -m pytest -q tests/test_website_unicode_reconciliation.py tests/test_website_url_convergence.py
          python -m pytest -q
      - name: Commit and remove helpers
        run: |
          rm scripts/_patch_unicode_reconciliation_version.py
          rm .github/workflows/patch-unicode-reconciliation-version.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Version Unicode website reconciliation semantics"
          git push origin HEAD:${GITHUB_REF_NAME}
