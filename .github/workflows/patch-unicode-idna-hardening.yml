name: Patch Unicode IDNA hardening

on:
  push:
    branches:
      - fix/website-unicode-idna-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded patch
        run: python scripts/_patch_unicode_idna_hardening.py
      - name: Install and verify
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src
          python -m pytest -q tests/test_website_parser.py tests/test_website_http.py
          python -m pytest -q
      - name: Commit source patch and remove helpers
        run: |
          rm scripts/_patch_unicode_idna_hardening.py
          rm .github/workflows/patch-unicode-idna-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden website Unicode and IDNA transport normalization"
          git push origin HEAD:${GITHUB_REF_NAME}
