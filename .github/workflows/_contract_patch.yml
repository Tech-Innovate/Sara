name: Preserve Maps error contracts

on:
  push:
    branches:
      - fix/maps-source-shape-merge-probe

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic contract patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/sara/maps_backfill.py',
              'from .maps_source import official_website\n',
              'from .maps_source import MapsSourceShapeError, official_website\n',
          )
          replace_once(
              'src/sara/maps_backfill.py',
              'def _source_values(raw: dict[str, Any]) -> dict[str, Any]:\n    longitude = raw.get("longitude")\n    if longitude is None:\n        longitude = raw.get("longtitude")\n    return {\n',
              'def _source_values(raw: dict[str, Any]) -> dict[str, Any]:\n    longitude = raw.get("longitude")\n    if longitude is None:\n        longitude = raw.get("longtitude")\n    try:\n        website = official_website(raw)\n    except MapsSourceShapeError as exc:\n        raise MapsBackfillError(str(exc)) from exc\n    return {\n',
          )
          replace_once(
              'src/sara/maps_backfill.py',
              '        "website": official_website(raw),\n',
              '        "website": website,\n',
          )
          replace_once(
              'src/sara/maps_sync.py',
              '    values = mb._source_values(raw)\n',
              '    try:\n        values = mb._source_values(raw)\n    except mb.MapsBackfillError as exc:\n        raise MapsSyncError(str(exc)) from exc\n',
          )

          replace_once(
              'tests/test_maps_source_shape.py',
              '    with pytest.raises(MapsSourceShapeError):\n        mb.backfill_maps_business_understanding(conn)\n',
              '    with pytest.raises(mb.MapsBackfillError, match="conflicting Maps website fields"):\n        mb.backfill_maps_business_understanding(conn)\n',
          )
          replace_once(
              'tests/test_maps_sync.py',
              'from sara.maps_sync import MapsSyncError, sync_maps_business_understanding\n',
              'from sara.maps_sync import (\n    SYNC_RECONCILIATION_VERSION,\n    MapsSyncError,\n    sync_maps_business_understanding,\n)\n',
          )
          replace_once(
              'tests/test_maps_sync.py',
              '        "maps-sync-v1",\n',
              '        SYNC_RECONCILIATION_VERSION,\n',
          )
          replace_once(
              'tests/test_maps_sync_hardening.py',
              'from sara.maps_sync import MapsSyncError, sync_maps_business_understanding\n',
              'from sara.maps_sync import SYNC_VERSION, MapsSyncError, sync_maps_business_understanding\n',
          )
          replace_once(
              'tests/test_maps_sync_hardening.py',
              '        "AND o.extractor_version=\'1\' "\n',
              '        f"AND o.extractor_version=\'{SYNC_VERSION}\' "\n',
          )

          Path('.github/workflows/_contract_patch.yml').unlink()
          PY
      - name: Commit branch patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve Maps extraction error contracts'
          git push origin HEAD:fix/maps-source-shape-merge-probe
