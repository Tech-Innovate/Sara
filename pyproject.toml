[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sara-local-collector"
version = "0.1.0"
description = "Local orchestration and canonical storage for coverage-oriented Google Maps collection."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Tech-Innovate"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sara = "sara.cli:main"
sara-maps-sync = "sara.maps_sync:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]